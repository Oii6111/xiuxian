name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cache the Godot editor and Web template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot-4.7.2
            ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip
          key: godot-4.7.2-linux-x86_64-web-nothreads
      - name: Install Godot and the Web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          godot_dir="$RUNNER_TEMP/godot-4.7.2"
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$godot_dir" "$template_dir"
          cd "$RUNNER_TEMP"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl --fail --location --retry 3 --retry-all-errors --output godot-editor.zip "$release/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --retry-all-errors --output godot-templates.tpz "$release/Godot_v4.7.2-stable_export_templates.tpz"
          sha256sum --check <<'CHECKSUMS'
          cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-editor.zip
          f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  godot-templates.tpz
          CHECKSUMS
          unzip -jq godot-editor.zip '*Godot_v4.7.2-stable_linux.x86_64' -d "$godot_dir"
          unzip -p godot-templates.tpz '*web_nothreads_release.zip' > "$template_dir/web_nothreads_release.zip"
          unzip -tq "$template_dir/web_nothreads_release.zip"
      - name: Export the full Web game
        shell: bash
        run: |
          godot="$RUNNER_TEMP/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64"
          site="$RUNNER_TEMP/pages-site"
          mkdir -p "$site"
          "$godot" --headless --path "$GITHUB_WORKSPACE" --import
          "$godot" --headless --path "$GITHUB_WORKSPACE" --export-release Web "$site/index.html"
          for name in index.html index.js index.wasm index.pck; do
            test -s "$site/$name"
          done
          touch "$site/.nojekyll"
          printf '%s\n' "$GITHUB_SHA" > "$site/source-commit.txt"
      - name: Upload the exported game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
