<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <base href="./play/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>疯狂修仙，中</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    html, body { margin: 0; overflow: hidden; background: #10151f; color: #fff3d6; }
    body { font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center;
      box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #canvas { display: block; width: var(--game-width); height: var(--game-height);
      touch-action: none; outline: none; }
    /* iOS zooms focused inputs below 16px, including Godot's native IME elements. */
    #stage > input, #stage > textarea { font-size: 16px; }
    #status { position: absolute; inset: 0; display: grid; place-content: center;
      gap: 12px; padding: 24px; text-align: center; background: #10151f; }
    #status[hidden] { display: none; }
    progress { width: min(65vw, 420px); accent-color: #dbab62; justify-self: center; }
    #rotate { display: none; pointer-events: none; position: absolute;
      top: max(12px, env(safe-area-inset-top)); padding: 9px 14px; border-radius: 20px;
      background: #242d3a; font-size: 14px; }
    @media (pointer: coarse) and (orientation: portrait) {
      #stage:not(.editing) #rotate { display: block; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1440" height="900">此浏览器无法显示游戏画面。</canvas>
    <span id="rotate">横屏游玩，按键更好操作</span>
    <div id="status" role="status">
      <span id="status-text">正在载入仙村…</span>
      <progress id="progress" aria-label="加载进度"></progress>
    </div>
  </main>
  <noscript>请启用 JavaScript 后重新打开游戏。</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":98906260,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    let fittedWidth = 0;
    let fittedHeight = 0;
    let editing = false;
    let preEditHeight = 0;
    let preEditWidth = 0;

    function fitCanvas() {
      const style = getComputedStyle(stage);
      const verticalPadding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
      const width = window.innerWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = window.innerHeight - verticalPadding;
      // Keep the fitted stage size and origin while the keyboard covers the viewport.
      if ((editing || window.visualViewport?.height < preEditHeight - 100) &&
          Math.abs(width - preEditWidth) < 4 && height < preEditHeight) {
        stage.style.height = preEditHeight + verticalPadding + "px";
        return;
      }
      stage.style.removeProperty("height");
      const scale = Math.min(width / 1440, height / 900);
      fittedWidth = width;
      fittedHeight = height;
      canvas.style.setProperty("--game-width", Math.floor(1440 * scale) + "px");
      canvas.style.setProperty("--game-height", Math.floor(900 * scale) + "px");
    }

    stage.addEventListener("focusin", (event) => {
      if (!event.target.matches("input, textarea")) return;
      if (!editing) {
        preEditWidth = fittedWidth;
        preEditHeight = fittedHeight;
      }
      editing = true;
      stage.classList.add("editing");
    });
    stage.addEventListener("focusout", () => {
      requestAnimationFrame(() => {
        editing = stage.contains(document.activeElement) && document.activeElement.matches("input, textarea");
        stage.classList.toggle("editing", editing);
        fitCanvas();
      });
    });
    window.addEventListener("resize", fitCanvas);
    window.visualViewport?.addEventListener("resize", fitCanvas);
    fitCanvas();

    const engine = new Engine(config);
    const missing = Engine.getMissingFeatures({ threads: false });
    function showError(error) {
      document.getElementById("status-text").textContent = "游戏加载失败：" + error;
      progress.hidden = true;
      console.error(error);
    }
    if (missing.length) {
      showError(missing.join("、"));
    } else {
      // Assemble the exported game pack from the static release files.
      async function startPagesBuild() {
        const pack = new Uint8Array(98906260);
        progress.max = pack.length;
        const parts = ["game-f55b646-01.bin", "game-f55b646-02.bin", "game-f55b646-03.bin", "game-f55b646-04.bin"];
        const loadingPack = (async () => {
          let offset = 0;
          for (const name of parts) {
            const response = await fetch(name);
            if (!response.ok) throw new Error(name + " HTTP " + response.status);
            const bytes = new Uint8Array(await response.arrayBuffer());
            pack.set(bytes, offset);
            offset += bytes.length;
            progress.value = offset;
          }
          if (offset !== pack.length) throw new Error("游戏资源下载不完整");
          await engine.preloadFile(pack, "index.pck");
        })();
        await Promise.all([engine.init(config.executable), loadingPack]);
        await engine.start({ canvas, args: ["--main-pack", "index.pck"] });
      }
      startPagesBuild().then(() => { status.hidden = true; }, showError);
    }
  </script>
</body>
</html>
